<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Customs: App Check</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    header {
      background: #00356b;
      color: #fff;
      padding: 1.5rem 2rem;
      border-bottom: 4px solid #fff;
      box-shadow: 0 4px 0 #286dc0;
    }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 0.4rem 0 0; opacity: 0.85; }
    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    figure {
      margin: 0 0 2.5rem;
      background: #fff;
      border: 1px solid #d5deea;
      border-top: 4px solid #00356b;
      border-radius: 10px;
      padding: 1.25rem;
    }
    figure h2 { margin: 0 0 1rem; color: #00356b; font-size: 1.25rem; }
    figure img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border: 1px solid #d5deea;
      border-radius: 6px;
    }
    figcaption {
      margin-top: 0.9rem;
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Campus Customs: App Check</h1>
    <p>Problem 11: Site testing. Screenshots of checks I ran on the running app.</p>
  </header>

  <main>
    <figure>
      <h2>1. Inventory check</h2>
      <a href="app_check_images/inventory.png">
        <img src="app_check_images/inventory.png" alt="The chatbot answers a question about inventory for Squash sweaters, showing the Squash Left Chest Tennis crewneck, its price, and the sizes in stock, with the product card shown on the page.">
      </a>
      <figcaption>This shows that the chatbot agent can fetch stock data and the product that is being inquired so the customer can read more</figcaption>
    </figure>

    <figure>
      <h2>2. Dynamic search result cards</h2>
      <a href="app_check_images/dynamicsearchresultcards.png">
        <img src="app_check_images/dynamicsearchresultcards.png" alt="After asking the chatbot to find hoodies, the page shows 8 hoodie product cards under Results for find hoodies, and the chat lists the same products.">
      </a>
      <figcaption>This shows the dynamic product cards that the agent presents when asked about hoodies</figcaption>
    </figure>

    <figure>
      <h2>3. Usability feature: Start over</h2>
      <a href="app_check_images/usabilityfeature.png">
        <img src="app_check_images/usabilityfeature.png" alt="The Campus Customs Assistant chat window with the Start over button in its header.">
      </a>
      <figcaption>This shows the Start over button on the AI chatbot which is useful for resetting the bot</figcaption>
    </figure>
  </main>
</body>
</html>
